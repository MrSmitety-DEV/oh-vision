name: Build OH Thai Tooltip Member

# เวอร์ชัน Member: ขึ้นเป็น pre-release (ไม่ใช่ latest ไม่กระทบลิงก์ดาวน์โหลดเวอร์ชันฟรี)
# โหลดไปก็ใช้ไม่ได้ถ้าไม่มียศ Member เพราะตรวจยศฝั่งเซิร์ฟเวอร์ทุกครั้งที่เปิด
on:
  push:
    paths:
      - '.github/workflows/build-thai-tooltip-member.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install pyinstaller pillow pystray mss rapidfuzz numpy onnxruntime rapidocr==3.10.0

      - name: Build exe
        working-directory: thai-tooltip
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "OH-Thai-Tooltip-Member" --icon thai_tooltip.ico
          --add-data "oh_thai_db.json;." --add-data "oh_web.json;." --add-data "thai_tooltip.png;."
          --add-data "member_edition.flag;."
          --paths . --collect-all rapidocr --collect-all omegaconf --collect-all antlr4
          --hidden-import PIL._tkinter_finder --hidden-import pystray._win32 --hidden-import member
          --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide6 --exclude-module matplotlib
          --exclude-module scipy --exclude-module pandas --exclude-module torch --exclude-module paddle
          --exclude-module openvino --exclude-module tensorrt
          "OH Thai Tooltip.pyw"

      - uses: actions/upload-artifact@v4
        with:
          name: OH-Thai-Tooltip-Member
          path: thai-tooltip/dist/OH-Thai-Tooltip-Member.exe
          retention-days: 14

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path "thai-tooltip/OH Thai Tooltip.pyw" -Pattern "^VERSION = '([^']+)'").Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: thai-tooltip-member-v${{ steps.ver.outputs.version }}
          name: OH Thai Tooltip Member v${{ steps.ver.outputs.version }}
          prerelease: true
          make_latest: false
          body: เวอร์ชัน Member — ต้องมียศ YouTube Member ใน Discord ของช่อง MrSmitety ถึงจะใช้งานได้
          files: thai-tooltip/dist/OH-Thai-Tooltip-Member.exe
